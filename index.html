<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mischenko Edu — информатика, математика и программирование</title>

<meta name="description" content="Mischenko Edu — индивидуальное обучение информатике, математике и программированию. Занятия, авторские пособия и личный кабинет ученика.">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

:root{
--bg:#09090b;
--card:#15151b;
--text:#f8f8f8;
--muted:#a1a1aa;
--accent:#ff6b6b;
--accent2:#f4a261;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{
font-family:Inter,Arial,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.6;
}


.container{
max-width:1200px;
margin:auto;
padding:0 24px;
}



/* HEADER */


header{

display:flex;
justify-content:space-between;
align-items:center;

padding:25px 0;

}


.logo{

font-size:24px;
font-weight:800;

}

.logo span{
color:var(--accent);
}


nav a{

color:#aaa;
text-decoration:none;
margin-left:25px;
font-size:15px;

}

nav a:hover{
color:white;
}



/* HERO */


.hero{

display:grid;
grid-template-columns:1.2fr 1fr;
gap:60px;
align-items:center;

padding:90px 0;

}


.badge{

display:inline-block;

padding:8px 16px;

border-radius:30px;

background:rgba(255,107,107,.1);

color:var(--accent);

font-size:14px;

margin-bottom:25px;

}



h1{

font-size:56px;

line-height:1.1;

letter-spacing:-2px;

}


h1 span{

background:linear-gradient(
90deg,
#ff6b6b,
#f4a261
);

-webkit-background-clip:text;
color:transparent;

}



.hero p{

font-size:20px;

color:var(--muted);

margin:30px 0;

max-width:550px;

}



.buttons{

display:flex;

gap:15px;

}



.btn{

padding:15px 30px;

border-radius:40px;

text-decoration:none;

font-weight:600;

}



.primary{

background:var(--accent);

color:white;

}



.secondary{

border:1px solid #333;

color:white;

}



/* PHOTO */


.photo{

height:520px;

border-radius:35px;

background:

linear-gradient(
145deg,
rgba(255,107,107,.2),
rgba(244,162,97,.05)
);


display:flex;

align-items:center;

justify-content:center;

font-size:100px;

}





/* SECTION */


section{

padding:90px 0;

}


.title{

font-size:38px;

margin-bottom:15px;

}


.subtitle{

color:var(--muted);

max-width:600px;

}



@media(max-width:800px){


.hero{

grid-template-columns:1fr;

text-align:center;

}


h1{

font-size:38px;

}


.buttons{

justify-content:center;

flex-direction:column;

}


nav{

display:none;

}


.photo{

height:350px;

}

}


</style>

</head>


<body>


<div class="container">


<header>


<div class="logo">
Mischenko<span>Edu</span>
</div>


<nav>

<a href="#about">О платформе</a>
<a href="#courses">Направления</a>
<a href="#materials">Пособия</a>
<a href="#cabinet">Кабинет</a>

</nav>


</header>




<section class="hero">


<div>


<div class="badge">
Информатика • Математика • Программирование
</div>



<h1>

Понимай сложное.
<br>

<span>Создавай будущее.</span>

</h1>



<p>

Образовательная система Mischenko Edu:
индивидуальные занятия, авторские материалы
и личный кабинет ученика.

</p>



<div class="buttons">

<a class="btn primary"
href="https://t.me/katerin_mischenko">

Начать обучение →

</a>


<a class="btn secondary"
href="#materials">

Посмотреть пособия

</a>


</div>


</div>



<div class="photo">

</div>


</section>
