name: Validate diagnostics
on:
  push:
    paths:
      - "edu/diagnostika.html"
      - "edu/diagnostics/**"
      - ".github/workflows/diagnostics-validation.yml"
  pull_request:
    paths:
      - "edu/diagnostika.html"
      - "edu/diagnostics/**"
      - ".github/workflows/diagnostics-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate banks and frontend syntax
        run: python edu/diagnostics/validate_diagnostics.py
      - name: Validate supplementary skill question pool
        run: python edu/diagnostics/validate_skill_question_pool.py
      - name: Test Worker API, consent, archive and retention
        run: node --test edu/diagnostics/worker.test.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: node --test edu/diagnostics/frontend.smoke.test.mjs
      - name: Check deployed Worker health (non-blocking)
        continue-on-error: true
        run: |
          echo "Checking the public Worker health endpoint..."
          curl --fail --silent --show-error --max-time 10 https://mischenko-edu-diagnostics.mks-ki.workers.dev/ || echo "Worker endpoint is not reachable from CI; deploy or verify it manually."
